<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fein — estudio de diseño e identidad de marca. Trabajamos la marca como una experiencia completa: identidad, diseño digital, motion y producto." />
    <meta name="theme-color" content="#070707" />
    <title>Fein — Estudio de diseño e identidad de marca</title>

    <!-- Open Graph / Twitter Card — sin esto, compartir el link en
         WhatsApp/LinkedIn/Slack muestra una preview vacía o rota. Sin
         `og:image` propia todavía (no hay una imagen 1200x630 lista);
         los clientes que la piden van a caer al og:title/description
         solamente, mejor que nada en blanco. Agregar `og:image` acá
         apenas exista un asset — no hace falta tocar nada más. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fein" />
    <meta property="og:title" content="Fein — Estudio de diseño e identidad de marca" />
    <meta property="og:description" content="Trabajamos la marca como una experiencia completa: identidad, diseño digital, motion y producto." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fein — Estudio de diseño e identidad de marca" />
    <meta name="twitter:description" content="Trabajamos la marca como una experiencia completa: identidad, diseño digital, motion y producto." />

    <!-- Tipografía única para todo el sitio: Inter. Se probó mezclar con
         un serif itálico (Instrument Serif) para el manifiesto y el cierre
         de contacto, pero no convenció — se volvió a una sola tipografía
         limpia en todos lados. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
