<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudiosFein — estudio de diseño e identidad de marca." />
    <meta name="theme-color" content="#fdfdfd" />
    <title>StudiosFein</title>

    <!-- Open Graph / Twitter Card — sin esto, compartir el link en
         WhatsApp/LinkedIn/Slack muestra una preview vacía o rota. Sin
         `og:image` propia todavía (no hay una imagen 1200x630 lista);
         los clientes que la piden van a caer al og:title/description
         solamente, mejor que nada en blanco. Agregar `og:image` acá
         apenas exista un asset — no hace falta tocar nada más. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StudiosFein" />
    <meta property="og:title" content="StudiosFein" />
    <meta property="og:description" content="Estudio de diseño e identidad de marca." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="StudiosFein" />
    <meta name="twitter:description" content="Estudio de diseño e identidad de marca." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
